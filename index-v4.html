<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ivan Bodnar — violetredhitheaven · Dusty Ochre</title>
<meta name="description" content="Building systems that survive reality. Software Engineer and Machine Learning Engineer portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #0C0B09;
  --surface: #141311;
  --fg: #F0EDE2;
  --muted: #AFA692;
  --accent: #B5A460;
  --accent-hover: #C9B774;
  --border: rgba(240,237,226,0.08);
  --border-light: rgba(237,234,240,0.03);
  --font-display: 'DM Serif Display', 'EB Garamond', Georgia, serif;
  --font-body: 'Space Grotesk', 'Inter', -apple-system, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace;
  --max-width: 1600px;
  --nav-height: 64px;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --g-pad: 48px;
  --g-gap: 1px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{overflow-x:hidden;min-height:100vh}
::selection{background:var(--accent);color:var(--bg)}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
h1,h2,h3,h4,h5,h6{font-family:var(--font-display);font-weight:400;line-height:1.1;color:var(--fg);letter-spacing:-0.02em}
.noise-fixed{position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0.3;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-repeat:repeat;background-size:256px 256px}
.container{width:100%;max-width:var(--max-width);margin:0 auto;padding:0 40px}
@media(max-width:768px){.container{padding:0 20px}}
.section{padding:140px 0;position:relative}
.section-label{font-family:var(--font-mono);font-size:12px;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);margin-bottom:20px;font-weight:500}
.section-title{font-size:clamp(36px,5vw,64px);margin-bottom:48px;letter-spacing:-0.03em;font-weight:400}
@media(max-width:768px){.section-title{font-size:32px;margin-bottom:32px};.section{padding:80px 0}}
.reveal{opacity:0;transform:translateY(24px);transition:opacity 0.8s var(--ease-out-expo),transform 0.8s var(--ease-out-expo)}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal-delay-1{transition-delay:0.1s}
.reveal-delay-2{transition-delay:0.2s}
.reveal-delay-3{transition-delay:0.3s}
.reveal-delay-4{transition-delay:0.4s}
.reveal-delay-5{transition-delay:0.5s}

/* === Hermes-Inspired Auto-Grid System === */
.g {
  display: grid;
  grid-template-columns: repeat(1, minmax(0, 1fr));
  border-top: 1px solid var(--border);
}
.g > .gc {
  border-right: none;
  border-bottom: 1px solid var(--border);
  padding: var(--g-pad);
  min-width: 0;
  position: relative;
}
.g > .gc:first-child {
  border-left: none;
}
@media (min-width: 640px) {
  .g:has(> .gc:nth-child(2)),
  .g:has(> .gc:nth-child(3)) {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .g:has(> .gc:nth-child(4)),
  .g:has(> .gc:nth-child(5)),
  .g:has(> .gc:nth-child(6)) {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .g > .gc {
    border-right: 1px solid var(--border);
  }
  .g > .gc:last-child {
    border-right: none;
  }
}
@media (min-width: 1024px) {
  .g:has(> .gc:nth-child(3)):not(:has(> .gc:nth-child(4))) {
    grid-template-columns: 1fr 2fr 1fr;
  }
  .g:has(> .gc:nth-child(5)) {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}
.g-compact > .gc {
  padding: 40px;
}
@media (max-width: 640px) {
  :root{--g-pad: 28px}
  .g > .gc {
    border-right: none;
  }
}

/* === Nav === */
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-height);z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:rgba(14,13,11,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);transition:transform 0.4s var(--ease-out-expo)}
nav.hidden{transform:translateY(-100%)}
.nav-logo{font-family:var(--font-display);font-size:20px;font-weight:400;color:var(--fg);letter-spacing:-0.02em}
.nav-logo span{color:var(--accent)}
.nav-links{display:flex;gap:32px;list-style:none}
.nav-links a{font-size:13px;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);transition:color 0.3s;position:relative;padding:4px 0;font-weight:400}
.nav-links a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;background:var(--accent);transition:width 0.4s var(--ease-out-expo)}
.nav-links a:hover{color:var(--fg)}
.nav-links a:hover::after{width:100%}
.nav-links a.active{color:var(--fg)}
.nav-links a.active::after{width:100%}
.mobile-menu-btn{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none}
.mobile-menu-btn span{display:block;width:24px;height:1.5px;background:var(--fg);transition:transform 0.3s var(--ease-out-expo),opacity 0.3s}
.mobile-menu-btn.open span:nth-child(1){transform:rotate(45deg) translate(4.5px,4.5px)}
.mobile-menu-btn.open span:nth-child(2){opacity:0}
.mobile-menu-btn.open span:nth-child(3){transform:rotate(-45deg) translate(4.5px,-4.5px)}
@media(max-width:768px){.nav-links{display:none;position:fixed;top:var(--nav-height);left:0;right:0;background:var(--bg);flex-direction:column;padding:24px 32px;border-bottom:1px solid var(--border);gap:20px}.nav-links.open{display:flex}.mobile-menu-btn{display:flex}nav{padding:0 20px}}

/* === Hero === */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative;padding:120px 0 0;overflow:hidden}
.hero .g{border-top:none}
.hero-left{display:flex;flex-direction:column;justify-content:center;padding:80px 40px}
.hero-eyebrow{font-family:var(--font-mono);font-size:13px;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent);margin-bottom:24px}
.hero-title{font-size:clamp(48px,7vw,88px);font-weight:400;letter-spacing:-0.03em;line-height:1.06;margin-bottom:24px}
.hero-title em{font-style:italic;color:var(--accent)}
.hero-sub{font-size:clamp(16px,1.4vw,20px);color:var(--muted);max-width:520px;line-height:1.6;margin-bottom:48px}
.hero-actions{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:48px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 36px;border-radius:4px;font-size:14px;font-weight:500;letter-spacing:0.03em;transition:all 0.4s var(--ease-out-expo);position:relative;overflow:hidden}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-2px)}
.btn-secondary{border:1px solid var(--border);color:var(--fg)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.magnetic-btn{transform:translate(var(--mx,0),var(--my,0));transition:transform 0.2s ease-out}
.hero-timeline{display:flex;gap:40px;padding-top:32px;border-top:1px solid var(--border)}
.hero-timeline-item{display:flex;flex-direction:column;gap:4px}
.hero-timeline-label{font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)}
.hero-timeline-value{font-size:16px;font-weight:500;color:var(--fg)}
.hero-timeline-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-bottom:8px}
.hero-right{display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:500px;background:var(--surface)}
.hero-atmosphere{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
@media(max-width:768px){.hero{padding:100px 0 0;min-height:auto}.hero-left{padding:60px 20px}.hero-timeline{flex-direction:column;gap:20px;padding-top:24px}.hero-right{min-height:320px}}
@media(min-width:640px){.hero .g{grid-template-columns:1fr 1fr}}

/* === About === */
.about-pullquote{font-family:var(--font-display);font-size:clamp(22px,2.5vw,34px);font-style:italic;color:var(--fg);line-height:1.3;border-left:2px solid var(--accent);padding:24px 0 24px 32px;margin-top:24px}
.about-pullquote span{color:var(--accent);display:block;font-size:14px;margin-top:8px;font-family:var(--font-body);font-style:normal}
.about-body p{color:var(--muted);font-size:17px;line-height:1.8;margin-bottom:20px}
.about-body p:last-child{margin-bottom:0}
@media(min-width:640px){.about .g{grid-template-columns:1fr 2fr}}

/* === Projects === */
.project-filters{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{padding:8px 20px;font-size:13px;letter-spacing:0.03em;color:var(--muted);border:1px solid var(--border);transition:all 0.3s var(--ease-out-expo);font-family:var(--font-mono);text-transform:uppercase;font-size:11px;letter-spacing:0.1em}
.filter-btn:hover{border-color:var(--accent);color:var(--fg)}
.filter-btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.projects-grid{display:grid;gap:24px;grid-template-columns:1fr;border-top:none}
@media(min-width:640px){.projects-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.projects-grid{grid-template-columns:repeat(3,1fr)}}
.project-card{cursor:pointer;display:flex;flex-direction:column;height:100%;position:relative;border:1px solid var(--border);padding:36px;transition:all 0.4s var(--ease-out-expo)}
.project-card:hover{background:var(--surface)}
.project-card-category{font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.project-card-year{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-bottom:6px}
.project-card-title{font-family:var(--font-display);font-size:clamp(22px,1.8vw,28px);font-weight:400;color:var(--fg);margin-bottom:8px;transition:color 0.3s}
.project-card:hover .project-card-title{color:var(--accent)}
.project-card-tagline{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:20px;flex:1}
.project-card-tech{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.project-card-tech span{padding:4px 10px;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:3px;font-family:var(--font-mono)}
.project-card-arrow{color:var(--accent);opacity:0;transform:translateX(-8px);transition:all 0.4s var(--ease-out-expo);margin-top:8px}
.project-card:hover .project-card-arrow{opacity:1;transform:translateX(0)}

/* === Philosophy === */
.philosophy-card-number{font-family:var(--font-mono);font-size:44px;font-weight:500;color:color-mix(in srgb, var(--accent) 12%, transparent);margin-bottom:16px;line-height:1}
.philosophy-card-title{font-family:var(--font-display);font-size:24px;font-weight:400;margin-bottom:16px;color:var(--fg)}
.philosophy-card p{font-size:15px;color:var(--muted);line-height:1.8;max-width:52ch}

/* === Timeline === */
.timeline-item{display:flex;flex-direction:column;gap:6px}
.timeline-year{font-family:var(--font-mono);font-size:13px;color:var(--accent);letter-spacing:0.1em;text-transform:uppercase}
.timeline-title{font-family:var(--font-display);font-size:24px;font-weight:400;color:var(--fg);margin-top:4px}
.timeline-desc{font-size:15px;color:var(--muted);line-height:1.7;margin-top:4px;max-width:48ch}
.timeline-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-bottom:6px}

/* === Skills === */
.skills-group h3{font-family:var(--font-mono);font-size:12px;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);margin-bottom:24px;font-weight:500}
.skills-tags{display:flex;flex-wrap:wrap;gap:10px}
.skills-tag{padding:10px 20px;font-size:13px;border:1px solid var(--border);border-radius:4px;color:var(--muted);transition:all 0.3s;font-family:var(--font-mono);letter-spacing:0.02em}
.skills-tag:hover{border-color:var(--accent);color:var(--accent)}

/* === Contact === */
.contact-title{font-size:clamp(32px,4vw,52px);margin-bottom:20px}
.contact-sub{font-size:18px;color:var(--muted);margin-bottom:40px;max-width:480px}
.contact-links{display:flex;gap:16px;flex-wrap:wrap}
.contact-link{display:flex;align-items:center;gap:8px;padding:12px 24px;border:1px solid var(--border);font-size:14px;color:var(--muted);transition:all 0.3s var(--ease-out-expo)}
.contact-link:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}

/* === Footer === */
footer{padding:32px 40px;border-top:1px solid var(--border);text-align:center;font-size:13px;color:var(--muted)}

/* === Modal === */
.modal-overlay{position:fixed;inset:0;z-index:2000;background:rgba(14,13,11,0.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;overflow-y:auto;padding:0;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-close{position:fixed;top:20px;right:24px;z-index:2001;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--surface);border:1px solid var(--border);cursor:pointer;color:var(--fg);font-size:20px;transition:all 0.3s}
.modal-close:hover{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.modal-content{max-width:800px;margin:80px auto;padding:0 32px 80px}
.modal-category{font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.modal-title{font-size:clamp(32px,5vw,56px);margin-bottom:8px;letter-spacing:-0.02em}
.modal-tagline{font-size:18px;color:var(--muted);margin-bottom:48px;line-height:1.5;max-width:600px}
.modal-section{margin-bottom:40px}
.modal-section h3{font-family:var(--font-mono);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;font-weight:500}
.modal-section p{font-size:16px;color:var(--muted);line-height:1.7}
.modal-section p + p{margin-top:12px}
.modal-tech-list{display:flex;flex-wrap:wrap;gap:8px}
.modal-tech-list span{padding:6px 14px;font-size:13px;border:1px solid var(--border);border-radius:3px;color:var(--muted);font-family:var(--font-mono)}
.modal-outcome{background:var(--surface);border-left:2px solid var(--accent);padding:24px;border-radius:2px;margin-top:20px}
.modal-outcome p{color:var(--fg);font-size:15px}

@media(max-width:480px){.hero-title{font-size:36px}.hero-actions{flex-direction:column}.btn{width:100%;justify-content:center}}
</style>
</head>

<div id="root"></div>

<script>

/* === Nav === */
function Nav() {

    }, { rootMargin: '-40% 0px -50% 0px' });
    document.querySelectorAll('section[id]').forEach(s => observer.observe(s));
    return () => observer.disconnect();
  }, []);

  useEffect(() => {
    const onScroll = () => {
      const y = window.scrollY;

      setHidden(y > lastScroll.current && y > 200);

/* === Magnetic Button === */
function MagneticBtn({ children, className, href, onClick }) {
  const ref = useRef(null);
  const handleMouse = useCallback((e) => {
    if (!ref.current) return;
    const rect = ref.current.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width / 2;
    const y = e.clientY - rect.top - rect.height / 2;
    ref.current.style.setProperty('--mx', `${x * 0.2}px`);
    ref.current.style.setProperty('--my', `${y * 0.2}px`);
  }, []);
  const handleLeave = useCallback(() => {
    if (!ref.current) return;
    ref.current.style.setProperty('--mx', '0px');
    ref.current.style.setProperty('--my', '0px');
  }, []);
  const Tag = href ? 'a' : 'button';
  return (
    <Tag ref={ref} href={href} onClick={onClick}
         className={`magnetic-btn ${className || ''}`}
         onMouseMove={handleMouse} onMouseLeave={handleLeave}>
      {children}
    </Tag>
  );
}

/* === Reveal === */
function Reveal({ children, delay = 0, className = '' }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const observer = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) {
        setTimeout(() => el.classList.add('visible'), delay);
        observer.unobserve(el);
      }
    }, { threshold: 0.1 });
    observer.observe(el);
    return () => observer.disconnect();
  }, [delay]);
  return <div ref={ref} className={`reveal reveal-delay-${delay/100} ${className}`}>{children}</div>;
}

/* === SVG Atmosphere === */
function NodeNetwork() {

}

function WireframeCube() {
  const S = 180;
  const pts = [
    [0.3,0.2,0.3],[0.7,0.2,0.3],[0.7,0.2,0.7],[0.3,0.2,0.7],
    [0.3,0.8,0.3],[0.7,0.8,0.3],[0.7,0.8,0.7],[0.3,0.8,0.7]
  ];
  const project3 = (x,y,z) => ({x: 200 + (x-0.5)*S - (z-0.5)*S*0.4, y: 200 + (y-0.5)*S - (z-0.5)*S*0.2});
  const projected = pts.map(p => project3(p[0],p[1],p[2]));
  const faceEdges = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  return (
    <svg width="400" height="400" viewBox="0 0 400 400" style={{opacity:0.3}}>
      {faceEdges.map(([a,b],i) => (
        <line key={i} x1={projected[a].x} y1={projected[a].y} x2={projected[b].x} y2={projected[b].y}
              stroke="var(--accent)" strokeWidth="0.7" opacity="0.35" />
      ))}
    </svg>
  );
}

function NeuralConstellation() {
  const points = [];
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 30 + Math.random() * 140;
    points.push({x: 200 + Math.cos(angle)*r, y: 200 + Math.sin(angle)*r, r: 1 + Math.random()*2});
  }
  const links = [];
  for (let i = 0; i < points.length; i++) {
    for (let j = i+1; j < points.length; j++) {
      const dx = points[i].x - points[j].x, dy = points[i].y - points[j].y;
      if (dx*dx + dy*dy < 5000 && Math.random() < 0.3) links.push([i,j]);
    }
  }
  return (
    <svg width="400" height="400" viewBox="0 0 400 400" style={{opacity:0.25}}>
      {links.map(([a,b],i) => (
        <line key={i} x1={points[a].x} y1={points[a].y} x2={points[b].x} y2={points[b].y}
              stroke="var(--accent)" strokeWidth="0.4" opacity="0.2" />
      ))}
      {points.map((p,i) => (
        <circle key={i} cx={p.x} cy={p.y} r={p.r} fill="var(--accent)" opacity="0.4" />
      ))}
    </svg>
  );
}
